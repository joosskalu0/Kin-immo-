<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Top-level error suppressor: Prevents cross-origin 3rd-party script failures (GTM, AdSense, AdBlockers) from bubbling
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        if (!msg) return false;
        var str = typeof msg === 'string' ? msg : (msg.message || '');
        if (
          str === 'Script error.' ||
          str.indexOf('Script error') !== -1 ||
          str.indexOf('ResizeObserver') !== -1 ||
          !url ||
          (typeof url === 'string' && (
            url.indexOf('googletagmanager') !== -1 ||
            url.indexOf('google') !== -1 ||
            url.indexOf('doubleclick') !== -1 ||
            url.indexOf('facebook') !== -1 ||
            url.indexOf('tiktok') !== -1 ||
            url.indexOf('pagead2') !== -1
          ))
        ) {
          return true; // Prevents the error from firing to host
        }
        return false;
      };

      window.addEventListener('error', function(event) {
        if (!event) return;
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg === 'Script error.' ||
          msg.indexOf('Script error') !== -1 ||
          msg.indexOf('ResizeObserver') !== -1 ||
          filename.indexOf('googletagmanager') !== -1 ||
          filename.indexOf('google') !== -1 ||
          filename.indexOf('doubleclick') !== -1 ||
          filename.indexOf('facebook') !== -1 ||
          filename.indexOf('tiktok') !== -1 ||
          filename.indexOf('pagead2') !== -1
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopPropagation) event.stopPropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        if (!event) return;
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (msg.indexOf('Script error') !== -1 || msg.indexOf('Failed to fetch') !== -1) {
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      });

      // Immediate cleanup of legacy bloated localStorage items to prevent QuotaExceededError
      try {
        ['immocraft_properties', 'immocraft_agents', 'immocraft_agencies', 'estatik_registered_users', 'estatik_kinshasa_user', 'immocraft_custom_fields', 'immocraft_deleted_properties', 'immocraft_saved_searches', 'kin_tracking_config', 'estatik_admin_credentials_v1'].forEach(function(k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
      } catch (e) {}
    </script>
