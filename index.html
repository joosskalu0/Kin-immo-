      // Top-level error suppressor: Prevents cross-origin 3rd-party script failures and Vite client HMR WS disconnects from bubbling
      (function() {
        // Neutralize Vite HMR WebSocket disconnects in iframe/proxy environments
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr') isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('ais-dev') !== -1 || url.indexOf('ais-pre') !== -1)) isViteHmr = true;
            if (isViteHmr) {
              var listeners = {};
              var fakeWs = {
                readyState: 1, // WebSocket.OPEN
                url: url,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open', target: fakeWs }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                },
                dispatchEvent: function(event) {
                  var cbs = listeners[event && event.type] || [];
                  cbs.forEach(function(cb) { try { cb(event); } catch(e) {} });
                  return true;
                }
              };
              return fakeWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        var isIgnoredError = function(str) {
          if (!str) return false;
          return (
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('Script error') !== -1 ||
            str.indexOf('ResizeObserver') !== -1 ||
            str.indexOf('Failed to fetch') !== -1 ||
            str.indexOf('_openDb') !== -1 ||
            str.indexOf('IndexedDB') !== -1 ||
            str.indexOf('indexedDB') !== -1 ||
            str.indexOf('googletagmanager') !== -1 ||
            str.indexOf('doubleclick') !== -1 ||
            str.indexOf('pagead2') !== -1 ||
            str.indexOf('facebook') !== -1 ||
            str.indexOf('tiktok') !== -1
          );
        };

        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = typeof msg === 'string' ? msg : (msg && msg.message ? msg.message : '');
          var urlStr = typeof url === 'string' ? url : '';
          var errStr = error ? ((error.stack || '') + ' ' + (error.message || '')) : '';
          var full = str + ' ' + urlStr + ' ' + errStr;
          if (isIgnoredError(full) || (!url && !msg)) {
            return true;
          }
          return false;
        };

        var handleError = function(event) {
          if (!event) return;
          var msg = event.message || '';
          var filename = event.filename || '';
          var errStr = (event.error && (event.error.stack || event.error.message)) ? (event.error.stack + ' ' + event.error.message) : '';
          var full = msg + ' ' + filename + ' ' + errStr;
          if (isIgnoredError(full)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        };

        var handleRejection = function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          var stack = reason ? (reason.stack || '') : '';
          var full = msg + ' ' + stack;
          if (isIgnoredError(full)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        };

        window.addEventListener('error', handleError, true);
        window.addEventListener('unhandledrejection', handleRejection, true);
        window.onunhandledrejection = handleRejection;
      })();

      // Immediate cleanup of legacy bloated localStorage items to prevent QuotaExceededError
      try {
        ['immocraft_properties', 'immocraft_agents', 'immocraft_agencies', 'estatik_registered_users', 'estatik_kinshasa_user', 'immocraft_custom_fields', 'immocraft_deleted_properties', 'immocraft_saved_searches', 'kin_tracking_config', 'estatik_admin_credentials_v1', 'kin_font_scale'].forEach(function(k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
      } catch (e) {}
