<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinshasa Immobilier - Plateforme Immobilière & Gestion RDC</title>
    <meta name="description" content="Plateforme immobilière de référence en République Démocratique du Congo : Vente, Location, Gestion locative et Annuaire des Agents certifiés à Kinshasa." />
    
    <!-- Google Tag Manager DataLayer & Global Telemetry Initializer -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Safe Error Handler to catch ad-blockers and cross-origin tag errors
      window.addEventListener('error', function(event) {
        if (!event) return;
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          msg === 'Script error.' ||
          msg.includes('Script error') ||
          filename.includes('googletagmanager') ||
          filename.includes('facebook') ||
          filename.includes('fbevents') ||
          filename.includes('tiktok')
        ) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopPropagation) event.stopPropagation();
          return true;
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
