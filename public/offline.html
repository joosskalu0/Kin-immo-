<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>Hors connexion — Kinimmo</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --royal: #1d4ed8;
        --royal-deep: #0b3ea8;
        --gold: #facc15;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        padding: 16px;
      }
      .shell {
        max-width: 820px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .hero {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .brand-name {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      .btn-primary, .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--royal);
        color: #ffffff;
      }
      .btn-primary:hover { background: var(--royal-deep); }
      .btn-secondary {
        background: #ffffff;
        color: var(--ink);
        border-color: var(--border);
      }
      .section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px;
      }
      .section h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
      }
      .item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #f8fafc;
        color: var(--ink);
        text-decoration: none;
        min-height: 44px;
      }
      .item:hover {
        border-color: var(--royal);
      }
      .item-title {
        font-weight: 700;
        font-size: 14px;
      }
      .item-meta {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .empty {
        font-size: 13px;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="brand">
          <svg width="36" height="36" viewBox="0 0 512 512" fill="none" aria-hidden="true">
            <rect width="512" height="512" rx="112" fill="#1D4ED8" />
            <path d="M96 232L256 100L416 232" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M138 208V392C138 405.255 148.745 416 162 416H350C363.255 416 374 405.255 374 392V208" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
            <path d="M210 416V304C210 278.595 230.595 258 256 258C281.405 258 302 278.595 302 304V416H210Z" fill="#FACC15" />
            <circle cx="256" cy="196" r="22" fill="#1D4ED8" />
          </svg>
          <span class="brand-name">Kinimmo</span>
        </div>
        <h1>Vous êtes hors connexion</h1>
        <p>
          Aucune connexion Internet détectée pour le moment. Vous pouvez consulter ci-dessous vos pages vues récemment,
          les annonces déjà enregistrées et vos favoris.
        </p>
        <div class="actions">
          <button type="button" class="btn-primary" id="retry-btn">Réessayer la connexion</button>
          <a href="/" class="btn-secondary">Retour à l’accueil en cache</a>
        </div>
      </section>

      <section class="section" aria-labelledby="recent-pages-title">
        <h2 id="recent-pages-title">Pages vues récemment</h2>
        <div id="recent-pages-list" class="list"></div>
      </section>

      <section class="section" aria-labelledby="recent-props-title">
        <h2 id="recent-props-title">Annonces vues récemment</h2>
        <div id="recent-props-list" class="list"></div>
      </section>

      <section class="section" aria-labelledby="fav-props-title">
        <h2 id="fav-props-title">Vos favoris enregistrés</h2>
        <div id="fav-props-list" class="list"></div>
      </section>
    </main>

    <script>
      (function () {
        var retryBtn = document.getElementById('retry-btn');
        if (retryBtn) {
          retryBtn.addEventListener('click', function () {
            window.location.reload();
          });
        }
        window.addEventListener('online', function () {
          window.location.reload();
        });

        function readJson(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            if (!raw) return fallback;
            var parsed = JSON.parse(raw);
            return parsed || fallback;
          } catch (e) {
            return fallback;
          }
        }

        function renderEmpty(container, text) {
          var p = document.createElement('p');
          p.className = 'empty';
          p.textContent = text;
          container.appendChild(p);
        }

        function createLinkCard(href, titleText, metaText) {
          var a = document.createElement('a');
          a.className = 'item';
          a.setAttribute('href', href);
          var title = document.createElement('span');
          title.className = 'item-title';
          title.textContent = titleText;
          var meta = document.createElement('span');
          meta.className = 'item-meta';
          meta.textContent = metaText;
          a.appendChild(title);
          a.appendChild(meta);
          return a;
        }

        var pagesContainer = document.getElementById('recent-pages-list');
        var recentPages = readJson('kinimmo_recent_pages_v1', []);
        if (!Array.isArray(recentPages) || recentPages.length === 0) {
          recentPages = [
            { path: '/', title: 'Accueil Kinimmo' },
            { path: '/rechercher', title: 'Rechercher un bien' },
            { path: '/favoris', title: 'Mes favoris' }
          ];
        }
        recentPages.slice(0, 8).forEach(function (entry) {
          if (!entry || !entry.path) return;
          pagesContainer.appendChild(
            createLinkCard(entry.path, entry.title || entry.path, entry.path)
          );
        });

        var recentPropsContainer = document.getElementById('recent-props-list');
        var recentProps = readJson('kinimmo_recent_properties_v1', []);
        var durableProps = readJson('kinimmo_durable_published_properties', []);
        if (Array.isArray(recentProps) && recentProps.length > 0) {
          recentProps.slice(0, 6).forEach(function (prop) {
            var priceText = (prop.price ? Number(prop.price).toLocaleString('fr-FR') : '—') + ' ' + (prop.currency || 'USD');
            var meta = (prop.commune || 'Kinshasa') + ' • ' + priceText + (prop.contactPhone ? ' • ' + prop.contactPhone : '');
            recentPropsContainer.appendChild(
              createLinkCard('/annonces/' + encodeURIComponent(prop.id), prop.title || 'Bien immobilier', meta)
            );
          });
        } else if (Array.isArray(durableProps) && durableProps.length > 0) {
          durableProps.slice(0, 6).forEach(function (prop) {
            var priceText = (prop.price ? Number(prop.price).toLocaleString('fr-FR') : '—') + ' ' + (prop.currency || 'USD');
            var meta = (prop.commune || 'Kinshasa') + ' • ' + priceText;
            recentPropsContainer.appendChild(
              createLinkCard('/annonces/' + encodeURIComponent(prop.id), prop.title || 'Bien immobilier', meta)
            );
          });
        } else {
          renderEmpty(recentPropsContainer, 'Aucune annonce consultée récemment en cache.');
        }

        var favContainer = document.getElementById('fav-props-list');
        var wishlist = readJson('kinimmo_wishlist_v1', []);
        var propIndex = {};
        if (Array.isArray(durableProps)) {
          durableProps.forEach(function (p) { if (p && p.id) propIndex[p.id] = p; });
        }
        if (Array.isArray(recentProps)) {
          recentProps.forEach(function (p) { if (p && p.id && !propIndex[p.id]) propIndex[p.id] = p; });
        }
        var favItems = Array.isArray(wishlist)
          ? wishlist.map(function (id) { return propIndex[id]; }).filter(Boolean)
          : [];

        if (favItems.length > 0) {
          favItems.slice(0, 6).forEach(function (prop) {
            var priceText = (prop.price ? Number(prop.price).toLocaleString('fr-FR') : '—') + ' ' + (prop.currency || 'USD');
            var meta = (prop.commune || 'Kinshasa') + ' • ' + priceText;
            favContainer.appendChild(
              createLinkCard('/annonces/' + encodeURIComponent(prop.id), prop.title || 'Favori', meta)
            );
          });
        } else {
          renderEmpty(favContainer, 'Aucun favori enregistré sur cet appareil.');
        }
      })();
    </script>
  </body>
</html>
